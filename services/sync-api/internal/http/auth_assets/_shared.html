{{- /*
  인증 페이지 4개가 공유하는 조각. 예전에는 각 페이지가 같은 <head> 와 CSS 를 각자 복사해
  갖고 있어서, 색이나 카드 모양을 바꾸려면 네 곳을 고쳐야 했다.

  페이지마다 다른 값(카드 너비, h1 크기, 버튼 색)은 여기 두지 않는다 — 각 페이지가 자기
  <style> 에서 이어서 선언한다.
*/ -}}

{{- define "auth-head" -}}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
{{- end -}}

{{- define "auth-base-css" -}}
      *, *::before, *::after { box-sizing:border-box; }
      body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0f1726; color:#f5f7fb; }
      /* 100vh 는 접히는 툴바까지 포함한 값이라, 상·하단 바가 고정된 인앱 브라우저 시트
         (iOS SFSafariViewController / Android Custom Tabs)에서는 실제 보이는 높이보다 크다.
         그 큰 박스를 기준으로 카드를 세로 가운데 두면 카드가 화면 밖으로 밀려 위쪽에 빈
         공간이 생긴다 — 지원하는 브라우저에서는 실제 보이는 높이(100dvh)를 쓴다. */
      .wrap { min-height:100vh; min-height:100dvh; display:flex; justify-content:center; padding:20px 16px; }
      /* 세로 가운데 정렬을 align-items 가 아니라 margin:auto 로 한다 — 카드가 화면보다 높을 때
         flex 중앙 정렬은 위쪽이 잘려 나가 스크롤해도 닿지 못한다. */
      .card { width:100%; margin:auto; background:#162133; border:1px solid rgba(255,255,255,.08); border-radius:20px; box-shadow:0 18px 48px rgba(0,0,0,.35); padding:24px; }
      .eyebrow { letter-spacing:.2em; font-size:12px; text-transform:uppercase; color:#9fb0d3; margin-bottom:10px; }
      @media (min-width:560px) {
        .wrap { padding:40px; }
        .card { border-radius:24px; padding:32px; }
      }
{{- end -}}
