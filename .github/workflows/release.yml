name: Repository Release
# 태그가 아니면 릴리스가 아니다. 실행 목록에서 그 둘이 섞이면 어느 것이 사용자에게 나간
# 빌드인지 알 수 없다.
run-name: ${{ startsWith(github.ref, 'refs/tags/') && 'Repository Release' || 'Manual build (no release)' }} • ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  # 태그 없이 손으로 돌리는 빌드. **릴리스를 만들지 않는다** — 산출물은 이 실행의 아티팩트로만
  # 남으므로 업데이트 피드에 보이지 않는다(publish-release 가 태그 푸시에서만 돈다).
  #
  # 릴리스 전에 자기 기계에서 먼저 써 보려는 용도다. 서명·공증은 릴리스와 같은 시크릿을 쓰므로
  # 산출물이 정식 빌드와 같다 — 로컬 빌드로는 그것까지 맞추기 어렵다.
  workflow_dispatch:
    inputs:
      include_android:
        description: "안드로이드 APK 도 함께 빌드(느리다 — 데스크톱만 필요하면 끈다)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  MOBILE_ENGINE_NDK_VERSION: "27.1.12297006"

concurrency:
  group: repository-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: Verify repository version matches tag
        id: version
        shell: bash
        env:
          # 수동 실행에는 태그가 없다. 버전 정합성 검사(version:check)는 그대로 하고, 태그와의
          # 대조만 건너뛴다 — 태그가 없는데 대조하면 손으로 돌릴 방법이 아예 없어진다.
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm run version:check
          node - <<'NODE'
          const rootVersion = require('./package.json').version;
          const isTag = process.env.IS_TAG === 'true';
          if (isTag) {
            const tagName = process.env.GITHUB_REF_NAME;
            const expectedTag = `v${rootVersion}`;
            if (tagName !== expectedTag) {
              console.error(`Repository version mismatch: expected ${expectedTag}, got ${tagName}`);
              process.exit(1);
            }
            console.log(`Repository version ${rootVersion} matches ${tagName}`);
          } else {
            console.log(`Manual build of repository version ${rootVersion} (no tag to match).`);
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${rootVersion}\n`);
          NODE

  ssh-core-test:
    name: ssh-core test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Run ssh-core tests
        working-directory: services/ssh-core
        run: go test ./... -cover

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop dev ssh-core binaries
        run: npm run prepare:ssh-core:dev --workspace @dolssh/desktop

      - name: Verify macOS desktop helper binaries
        if: matrix.os == 'macos-latest'
        run: |
          test -f apps/desktop/release/resources/darwin/universal/bin/ssh-core
          test -f apps/desktop/release/resources/darwin/universal/bin/dolgate-dns-helper

      - name: Verify Windows desktop helper binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          test -f apps/desktop/release/resources/win32/x64/bin/ssh-core.exe
          test -f apps/desktop/release/resources/win32/x64/bin/dolgate-dns-helper.exe
          test -f apps/desktop/release/resources/win32/x64/bin/aws-conpty-wrapper.exe

      - name: Verify Linux desktop helper binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -f apps/desktop/release/resources/linux/x64/bin/ssh-core
          test -f apps/desktop/release/resources/linux/x64/bin/dolgate-dns-helper

  desktop-test:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Install dependencies
        run: npm ci

      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary is installed
        # Electron 42+ 는 --version 검증에서도 Chromium 샌드박스를 초기화하는데,
        # CI 러너의 chrome-sandbox 는 setuid root 가 아니라 FATAL 로 죽는다. CI 한정 비활성화.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run ensure:electron --workspace @dolssh/desktop

      - name: Run desktop tests
        run: npm run test:desktop

  mobile-test:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile typecheck
        run: npm run typecheck:mobile

      - name: Run mobile tests
        run: npm run test:mobile -- --runInBand

  build-mac:
    runs-on: macos-latest
    needs:
      - verify-version
      - desktop-test
      - mobile-test
      - ssh-core-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Rust
        # rdp-core 는 rustls 를 통해 aws-lc-sys(C)를 링크해 GOOS/GOARCH 식 크로스컴파일이
        # 안 된다. 각 러너가 자기 플랫폼을 빌드한다. 버전은 rust-toolchain.toml 이 정한다.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      # 태그에서 저장한 캐시는 다음 태그가 볼 수 없다. Repository Test 의 main push 가 같은 키와
      # 경로에 debug 테스트 및 플랫폼별 release 산출물을 함께 저장하고, 릴리스는 복원만 한다.
      - name: Restore RDP cargo build
        id: cargo-cache-rdp
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/rdp-core/Cargo.toml', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore VNC cargo build
        id: cargo-cache-vnc
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/vnc-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-${{ hashFiles('services/vnc-core/Cargo.lock', 'services/vnc-core/Cargo.toml', 'services/vnc-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-

      - name: Report native release cache misses
        shell: bash
        env:
          RDP_CACHE_HIT: ${{ steps.cargo-cache-rdp.outputs.cache-hit }}
          VNC_CACHE_HIT: ${{ steps.cargo-cache-vnc.outputs.cache-hit }}
        run: |
          if [ "${RDP_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main RDP release cache was not found; this job may rebuild native dependencies."
          fi
          if [ "${VNC_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main VNC release cache was not found; this job may rebuild vendored OpenSSL."
          fi

      # 러너 번들 npm 이 codex 도입 후의 lock 그래프에서 hoist 된 7zip-bin 바이너리를
      # 누락 설치할 수 있어, 로컬에서 이 lock 을 올바르게 설치함을 검증한 npm 으로 고정한다.
      - name: Pin npm (lockfile-verified version)
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      # npm ci 가 성공해도 7zip-bin/mac/arm64/7za 가 빠진 채 남는 사례가 있어(lock 해시별
      # npm 캐시와 결합해 같은 커밋에서 결정적으로 재발) electron-builder 전에 존재를 보장한다.
      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Verify packaging binaries (7zip-bin self-heal)
        shell: bash
        run: |
          check() { node -e "process.exit(require('fs').existsSync(require('7zip-bin').path7za) ? 0 : 1)"; }
          if ! check; then
            echo "::warning::7zip-bin binary missing after npm ci — re-extracting from registry"
            ls -la node_modules/7zip-bin || true
            npm pack 7zip-bin@5.2.0
            rm -rf node_modules/7zip-bin
            mkdir -p node_modules/7zip-bin
            tar -xzf 7zip-bin-5.2.0.tgz -C node_modules/7zip-bin --strip-components 1
            rm -f 7zip-bin-5.2.0.tgz
            check
          fi

      - name: Build macOS release artifacts
        run: npm run release:dist:mac --workspace @dolssh/desktop
        env:
          # renderer Vite 번들이 러너 기본 V8 힙(~2GB)을 초과해 OOM으로 죽은 사례 대응
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-mac
          path: |
            apps/desktop/release/dist/*
            !apps/desktop/release/dist/builder-*.yml
            !apps/desktop/release/dist/builder-*.yaml
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    needs:
      - verify-version
      - desktop-test
      - mobile-test
      - ssh-core-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Rust
        # rdp-core 는 rustls 를 통해 aws-lc-sys(C)를 링크해 GOOS/GOARCH 식 크로스컴파일이
        # 안 된다. 각 러너가 자기 플랫폼을 빌드한다. 버전은 rust-toolchain.toml 이 정한다.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      # 태그에서 저장한 캐시는 다음 태그가 볼 수 없다. Repository Test 의 main push 가 같은 키와
      # 경로에 debug 테스트 및 플랫폼별 release 산출물을 함께 저장하고, 릴리스는 복원만 한다.
      - name: Restore RDP cargo build
        id: cargo-cache-rdp
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/rdp-core/Cargo.toml', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore VNC cargo build
        id: cargo-cache-vnc
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/vnc-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-${{ hashFiles('services/vnc-core/Cargo.lock', 'services/vnc-core/Cargo.toml', 'services/vnc-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-

      - name: Report native release cache misses
        shell: bash
        env:
          RDP_CACHE_HIT: ${{ steps.cargo-cache-rdp.outputs.cache-hit }}
          VNC_CACHE_HIT: ${{ steps.cargo-cache-vnc.outputs.cache-hit }}
        run: |
          if [ "${RDP_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main RDP release cache was not found; this job may rebuild native dependencies."
          fi
          if [ "${VNC_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main VNC release cache was not found; this job may rebuild vendored OpenSSL."
          fi

      # build-mac 과 동일한 가드 — 러너 npm 이 7zip-bin(win/x64/7za.exe)을 누락 설치하는
      # 사례 대응. path7za 가 플랫폼별 경로를 해석하므로 같은 스니펫을 그대로 쓴다.
      - name: Pin npm (lockfile-verified version)
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Verify packaging binaries (7zip-bin self-heal)
        shell: bash
        run: |
          check() { node -e "process.exit(require('fs').existsSync(require('7zip-bin').path7za) ? 0 : 1)"; }
          if ! check; then
            echo "::warning::7zip-bin binary missing after npm ci — re-extracting from registry"
            ls -la node_modules/7zip-bin || true
            npm pack 7zip-bin@5.2.0
            rm -rf node_modules/7zip-bin
            mkdir -p node_modules/7zip-bin
            tar -xzf 7zip-bin-5.2.0.tgz -C node_modules/7zip-bin --strip-components 1
            rm -f 7zip-bin-5.2.0.tgz
            check
          fi

      - name: Build Windows release artifacts
        run: npm run release:dist:win --workspace @dolssh/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-win
          path: |
            apps/desktop/release/dist/*
            !apps/desktop/release/dist/builder-*.yml
            !apps/desktop/release/dist/builder-*.yaml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - desktop-test
      - mobile-test
      - ssh-core-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Rust
        # rdp-core 는 rustls 를 통해 aws-lc-sys(C)를 링크해 GOOS/GOARCH 식 크로스컴파일이
        # 안 된다. 각 러너가 자기 플랫폼을 빌드한다. 버전은 rust-toolchain.toml 이 정한다.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      # 태그에서 저장한 캐시는 다음 태그가 볼 수 없다. Repository Test 의 main push 가 같은 키와
      # 경로에 debug 테스트 및 플랫폼별 release 산출물을 함께 저장하고, 릴리스는 복원만 한다.
      - name: Restore RDP cargo build
        id: cargo-cache-rdp
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/rdp-core/Cargo.toml', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore VNC cargo build
        id: cargo-cache-vnc
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/vnc-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-${{ hashFiles('services/vnc-core/Cargo.lock', 'services/vnc-core/Cargo.toml', 'services/vnc-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-

      - name: Report native release cache misses
        shell: bash
        env:
          RDP_CACHE_HIT: ${{ steps.cargo-cache-rdp.outputs.cache-hit }}
          VNC_CACHE_HIT: ${{ steps.cargo-cache-vnc.outputs.cache-hit }}
        run: |
          if [ "${RDP_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main RDP release cache was not found; this job may rebuild native dependencies."
          fi
          if [ "${VNC_CACHE_HIT}" != "true" ]; then
            echo "::warning::Exact main VNC release cache was not found; this job may rebuild vendored OpenSSL."
          fi

      - name: Install the aarch64 cross toolchain
        # 이 러너는 x64 인데 릴리스는 linux/arm64 도 낸다. ssh-core 는 GOARCH 만 바꾸면 되지만
        # rdp-core 는 aws-lc-sys(C)를 링크하므로 타깃용 컴파일러·링커가 있어야 한다.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # build-mac 과 동일한 가드 — 러너 npm 이 7zip-bin(linux/x64/7za)을 누락 설치하는
      # 사례 대응. path7za 가 플랫폼별 경로를 해석하므로 같은 스니펫을 그대로 쓴다.
      - name: Pin npm (lockfile-verified version)
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Verify packaging binaries (7zip-bin self-heal)
        shell: bash
        run: |
          check() { node -e "process.exit(require('fs').existsSync(require('7zip-bin').path7za) ? 0 : 1)"; }
          if ! check; then
            echo "::warning::7zip-bin binary missing after npm ci — re-extracting from registry"
            ls -la node_modules/7zip-bin || true
            npm pack 7zip-bin@5.2.0
            rm -rf node_modules/7zip-bin
            mkdir -p node_modules/7zip-bin
            tar -xzf 7zip-bin-5.2.0.tgz -C node_modules/7zip-bin --strip-components 1
            rm -f 7zip-bin-5.2.0.tgz
            check
          fi

      # fpm 은 rpm 타겟에 rpmbuild 를 요구하고, 데비안계열에서 그 바이너리는 rpm 패키지가
      # 제공한다. 지금 ubuntu-latest 이미지에는 rpm 이 들어 있어 없어도 통과하지만, 그건
      # 러너 이미지 내용에 기댄 암묵적 전제다 — 이미지가 바뀌면 태그를 밀고 나서야 알게 되니
      # 명시한다. 이미 있으면 몇 초에 끝난다.
      - name: Install rpm build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build Linux release artifacts
        run: npm run release:dist:linux --workspace @dolssh/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux
          path: |
            apps/desktop/release/dist/*
            !apps/desktop/release/dist/builder-*.yml
            !apps/desktop/release/dist/builder-*.yaml
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    # 태그 릴리스에는 항상 넣는다. 수동 빌드에서는 기본으로 뺀다 — 데스크톱만 확인하려는 경우가
    # 대부분이고 이 잡이 가장 오래 걸린다(러너 디스크가 빠듯해 간헐 실패도 여기서 난다).
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.include_android }}
    needs:
      - verify-version
      - mobile-test
    env:
      DOLGATE_ANDROID_RELEASE_ARCHES: arm64-v8a
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ubuntu-latest 여유 디스크(~14GB)로는 Android SDK+NDK+Go 툴체인+node_modules(AI SDK 추가로 1.5G급)+Gradle
      # 를 다 얹으면 "No space left on device"로 죽는다. 우리 빌드가 안 쓰는 프리인스톨만 비워 ~11GB 확보.
      # 지우는 건 전부 rm/prune 이라 수초~30초. large-packages(apt 제거, 1~3분)는 굳이 필요 없어 끔.
      # android/tool-cache(Node·Java)는 이 잡이 쓰므로 유지, swap 은 빌드 메모리 여유 위해 유지.
      # npm/Gradle 캐시는 별도 액션이 관리 → 이 스텝과 무관하게 그대로 재사용됨.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true # ~1.6GB
          haskell: true # ~5.6GB
          large-packages: false # apt 제거는 느려서 제외(위 셋만으로 충분)
          docker-images: true # ~4GB
          swap-storage: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;${MOBILE_ENGINE_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      # Installed from inside the module rather than with @latest, so a tag is
      # built with the x/mobile version services/ssh-core/go.mod pins. With
      # @latest a breaking gomobile release could fail a release build with no
      # change in the repository at all.
      - name: Install gomobile
        working-directory: services/ssh-core
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Build Go SSH engine (Android)
        run: npm run mobile:engine:build -- android "${DOLGATE_ANDROID_RELEASE_ARCHES}"

      - name: Restore Android release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          echo "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/dolgate-upload.keystore"

      - name: Build signed Android release APK
        env:
          DOLGATE_ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/dolgate-upload.keystore
          DOLGATE_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          DOLGATE_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          DOLGATE_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: npm run build:mobile:android

      - name: Prepare Android release artifact
        shell: bash
        run: |
          version="${{ needs.verify-version.outputs.version }}"
          mkdir -p release-artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-artifacts/Dolgate-android-v${version}.apk"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-android
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    # **수동 빌드는 여기 오지 않는다.** 산출물을 이 실행의 아티팩트로만 남기는 것이 목적이다 —
    # 릴리스를 만들면 그 순간 사용자 앱의 업데이트 확인에 걸린다.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - verify-version
      - build-mac
      - build-win
      - build-linux
      - build-android
    steps:
      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: desktop-release-*
          merge-multiple: true

      - name: Download Android release artifact
        uses: actions/download-artifact@v8
        with:
          name: mobile-release-android
          path: release-artifacts

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Upload unified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release-artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
