name: Repository Test
run-name: Repository Test • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOBILE_ENGINE_NDK_VERSION: "27.1.12297006"

jobs:
  version-check:
    name: version check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run version check
        run: npm run version:check

  root-typecheck:
    name: root typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root typecheck
        run: npm run typecheck

  sync-api-test:
    name: sync-api test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dolgate
          POSTGRES_PASSWORD: dolgate
          POSTGRES_DB: dolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolgate -d dolgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dolgate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_API_POSTGRES_DSN: host=127.0.0.1 user=dolgate password=dolgate dbname=dolgate port=5432 sslmode=disable
      SYNC_API_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/dolgate?charset=utf8mb4&parseTime=True&loc=UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/sync-api/go.sum

      - name: Run sync-api tests
        working-directory: services/sync-api
        run: go test ./... -cover

      - name: Stress vault lifecycle races
        working-directory: services/sync-api
        run: go test -race ./internal/store ./internal/http -run 'Vault|Sync' -count=3

  ssh-core-test:
    name: ssh-core test (${{ matrix.os }})
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Run ssh-core tests
        working-directory: services/ssh-core
        run: go test ./... -cover

      # 세션 stdin·프롬프트 게이트·핸드셰이크는 타이머/스트림 goroutine이 공유하는 상태라
      # -race 없이는 레이스가 그대로 통과한다(실제로 통과했었다). 전체 ./...에 -race를 걸면
      # 3-OS 매트릭스 비용이 늘고 타이밍 민감한 패키지(ssmforward 등)가 러너 부하에 따라
      # 흔들릴 수 있어, 동시성 핵심 패키지만 좁게 검사한다. 레이스 검출은 OS에 거의
      # 무관하므로 ubuntu에서만 돌린다. 필요해지면 대상 패키지를 넓히면 된다.
      - name: Stress ssh-core session races
        if: matrix.os == 'ubuntu-latest'
        working-directory: services/ssh-core
        run: go test -race ./internal/sshsession ./internal/autocomplete -count=2

      # Only here: GOOS=ios needs cgo, and cgo for an Apple target needs the
      # Apple toolchain, so this cannot run on the Linux job that binds the
      # Android ABIs. Riding the macOS matrix leg keeps it off a runner of its
      # own.
      - name: Verify the engine compiles for iOS
        if: matrix.os == 'macos-latest'
        working-directory: services/ssh-core
        run: GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build $(go list ./... | grep -v '/cmd/')

  # 사이드카가 **앱이 찾는 경로에 놓이는지** 보는 검사다. Go 테스트와 성격이 다르고(테스트가
  # 아니라 패키징 레이아웃 회귀 검사) 필요한 도구도 달라서 잡을 나눴다 — 한 잡에 묶여 있을 때는
  # Go 테스트 잡이 모노레포 전체를 npm ci 하느라 macOS 에서 94초를 더 썼다.
  #
  # npm 은 쓰지 않는다. build-ssh-core-dev.cjs 와 그것이 부르는 build-ssh-core.cjs 는 Node 내장
  # 모듈만 쓰므로(외부 패키지 0개) 스크립트를 직접 부르면 설치가 필요 없다.
  desktop-sidecar-layout:
    name: desktop sidecar layout (${{ matrix.os }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: Build desktop dev sidecar binaries
        working-directory: apps/desktop
        run: node ./scripts/build-ssh-core-dev.cjs

      - name: Verify macOS desktop helper binaries
        if: matrix.os == 'macos-latest'
        run: |
          test -f apps/desktop/release/resources/darwin/universal/bin/ssh-core
          test -f apps/desktop/release/resources/darwin/universal/bin/dolgate-dns-helper

      - name: Verify Windows desktop helper binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          test -f apps/desktop/release/resources/win32/x64/bin/ssh-core.exe
          test -f apps/desktop/release/resources/win32/x64/bin/dolgate-dns-helper.exe
          test -f apps/desktop/release/resources/win32/x64/bin/aws-conpty-wrapper.exe

      - name: Verify Linux desktop helper binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -f apps/desktop/release/resources/linux/x64/bin/ssh-core
          test -f apps/desktop/release/resources/linux/x64/bin/dolgate-dns-helper

  go-hygiene:
    name: go hygiene
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      # 포맷은 3-OS 매트릭스에 걸 필요가 없어 단독 잡으로 한 번만 본다.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l services/ssh-core services/sync-api)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt 미준수 파일:"
            echo "${unformatted}"
            echo "고치는 방법: gofmt -w <파일>"
            exit 1
          fi

      # ssh-core 는 ./... 에 선행 발견이 있어(vendor 한 ssmdatachannel 의 unreachable code,
      # sshconn 의 IPv6 주소 포맷은 수정됨) 게이트로 쓸 수 없다. gomobile bind 표면인
      # ./mobile/ 만 본다 — 여기가 깨지면 모바일 앱이 통째로 못 뜨므로 가장 값이 크다.
      - name: Vet the ssh-core mobile bind surface
        working-directory: services/ssh-core
        run: go vet ./mobile/

      - name: Vet sync-api
        working-directory: services/sync-api
        run: go vet ./...

      # ssh-core 에 의존성을 추가하면 sync-api 도 tidy 해야 한다(local replace 로 import 하므로).
      # 안 하면 sync-api 가 missing go.sum entry 로 깨지는데, 그 사실을 여기서 잡는다.
      - name: Check go.mod tidiness
        run: |
          for module in services/ssh-core services/sync-api; do
            if ! (cd "${module}" && go mod tidy -diff); then
              echo "${module} 의 go.mod/go.sum 이 tidy 상태가 아니다."
              echo "고치는 방법: cd ${module} && go mod tidy"
              exit 1
            fi
          done

  rdp-core-test:
    name: rdp-core test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        # 버전은 services/rdp-core/rust-toolchain.toml 이 정한다. profile = "minimal" 이라
        # rustfmt·clippy 는 없다 — 포맷 게이트를 넣으려면 컴포넌트부터 붙여야 한다.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      # 테스트와 릴리스가 같은 target 캐시를 쓴다. main push 에서는 아래에서 Linux x64·arm64
      # release 타깃도 빌드하므로, 이후 태그 릴리스가 기본 브랜치의 이 캐시를 그대로 복원한다.
      # v2 는 예전 debug-only 캐시와 구분해 첫 main 실행이 release 산출물을 반드시 저장하게 한다.
      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/rdp-core/Cargo.toml', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # 3-OS 매트릭스로 돌리지 않는다. 컴파일 오류와 로직 회귀는 플랫폼에 거의 무관하고,
      # 플랫폼별 빌드는 릴리스 워크플로가 각 러너에서 이미 한다(크로스컴파일이 안 되는
      # 이유는 그쪽 주석 참조). 이 잡의 목적은 "PR 단계에서 Rust 가 아무 검증도 받지 않는"
      # 상태를 없애는 것이다 — 그 전까지는 릴리스 태그를 밀 때 처음 알았다.
      - name: Run rdp-core tests
        working-directory: services/rdp-core
        run: cargo test

      # 패치를 얹은 vendor 크레이트는 별도 패키지라 위 명령에 안 잡힌다. 상류가 자기 테스트
      # 하네스를 껐던 것도 켜 두었으므로(vendor/ironrdp-rdpdr-native/Cargo.toml) 여기서 돌린다 —
      # 공유 폴더 경로 봉쇄와 장치별 루트 해석이 이 안에 있다.
      - name: Run patched vendor crate tests
        working-directory: services/rdp-core
        run: cargo test -p ironrdp-rdpdr-native

      # 태그 잡이 만든 캐시는 다음 태그가 볼 수 없다. 기본 브랜치 push 에서 실제 릴리스와 같은
      # 두 Linux 타깃을 미리 빌드해, 공유 가능한 main 범위 캐시에 넣는다. PR 은 테스트만 돈다.

      # apt 미러가 느린 날 이 스텝 하나가 30분을 먹은 적이 있다 — 59.7MB 를 33kB/s 로 받았다.
      # 멈춘 게 아니라 계속 조금씩 받고 있었으므로 타임아웃·재시도 설정으로는 끊기지 않는다.
      # 그래서 받을 .deb 목록을 캐시 키로 삼는다. 목록은 --print-uris 가 그대로 주고, 저장소
      # 버전이 바뀌면 키가 달라져 그때만 다시 받는다.
      - name: Resolve the aarch64 cross toolchain download set
        id: cross-apt
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --print-uris -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            | grep "^'" | sort > /tmp/cross-apt-uris.txt
          echo "key=$(sha256sum /tmp/cross-apt-uris.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the aarch64 cross toolchain packages
        if: github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-aarch64-cross-${{ steps.cross-apt.outputs.key }}

      - name: Install the Linux aarch64 cross toolchain
        id: cross-toolchain
        if: github.event_name == 'push'
        # 이 스텝은 릴리스 캐시 예열용이라 게이트가 아니다 — 미러가 느린 날에는 12분에 끊고
        # 잡을 계속 진행한다. 상한이 없으면 GitHub 기본값인 6시간까지 매달린다.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-cache" \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Warm Linux RDP release targets
        # 툴체인이 없으면 arm64 링크가 실패한다. continue-on-error 로 넘긴 실패는 outcome 에만
        # 남으므로(conclusion 은 success 로 덮인다) 그것을 보고 건너뛴다.
        if: github.event_name == 'push' && steps.cross-toolchain.outcome == 'success'
        run: |
          node apps/desktop/scripts/build-rdp-core.cjs linux x64
          node apps/desktop/scripts/build-rdp-core.cjs linux arm64

  vnc-core-test:
    name: vnc-core test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        # 버전은 services/vnc-core/rust-toolchain.toml 이 정한다(rdp-core 와 같은 채널).
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/vnc-core

      # vnc-core 는 openssl 을 vendored 로 끌어와 OpenSSL 을 소스에서 빌드한다(VeNCrypt 의
      # 익명 DH 때문에 rustls 로 대체할 수 없다 — Cargo.toml 주석 참조). 그래서 빌드에 perl 이
      # 필요하다. ubuntu 러너에는 기본 포함이지만, 러너 이미지가 그것을 빼면 여기서 깨진다.
      - name: Verify the OpenSSL build prerequisites
        run: perl --version

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/vnc-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-${{ hashFiles('services/vnc-core/Cargo.lock', 'services/vnc-core/Cargo.toml', 'services/vnc-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-

      # 이 잡이 없던 동안 vnc-core 의 테스트 100여 개가 CI 에서 한 번도 돌지 않았다 —
      # rdp-core 잡만 있어서 Rust 는 검증되는 것처럼 보였다.
      - name: Run vnc-core tests
        working-directory: services/vnc-core
        run: cargo test

      # core-framing 은 두 사이드카가 공유하는 크레이트인데, 의존하는 쪽에서 cargo test 를
      # 돌려도 그 크레이트의 테스트는 실행되지 않는다(패키지가 다르다). 잡을 따로 두기엔 작아서
      # 여기 얹는다 — vnc-core 의 path 의존이라 이미 컴파일돼 있다.
      - name: Run core-framing tests
        working-directory: services/core-framing
        run: cargo test

      # rdp-core 잡과 같은 이유로 main 에 Linux release 산출물을 저장한다. vendored OpenSSL 도
      # 여기서 한 번 컴파일되므로 태그 릴리스에서는 target 캐시로 재사용된다.

      # .deb 를 캐시하는 이유는 rdp-core test 잡의 같은 스텝 주석을 참조한다 — 미러가 느린 날
      # 60MB 다운로드가 30분씩 걸렸고, 진행이 멈추지 않아 타임아웃으로는 끊기지 않았다.
      - name: Resolve the aarch64 cross toolchain download set
        id: cross-apt
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --print-uris -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            | grep "^'" | sort > /tmp/cross-apt-uris.txt
          echo "key=$(sha256sum /tmp/cross-apt-uris.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the aarch64 cross toolchain packages
        if: github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-aarch64-cross-${{ steps.cross-apt.outputs.key }}

      - name: Install the Linux aarch64 cross toolchain
        id: cross-toolchain
        if: github.event_name == 'push'
        # 이 스텝은 릴리스 캐시 예열용이라 게이트가 아니다 — 미러가 느린 날에는 12분에 끊고
        # 잡을 계속 진행한다. 상한이 없으면 GitHub 기본값인 6시간까지 매달린다.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-cache" \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Warm Linux VNC release targets
        # 툴체인이 없으면 arm64 링크가 실패한다. continue-on-error 로 넘긴 실패는 outcome 에만
        # 남으므로(conclusion 은 success 로 덮인다) 그것을 보고 건너뛴다.
        if: github.event_name == 'push' && steps.cross-toolchain.outcome == 'success'
        run: |
          node apps/desktop/scripts/build-vnc-core.cjs linux x64
          node apps/desktop/scripts/build-vnc-core.cjs linux arm64

  # Rust 테스트는 Ubuntu 한 번이면 충분하지만, C 라이브러리를 링크하는 release 산출물은
  # 플랫폼별 네이티브 러너에서 만들어야 한다. main push 에서만 macOS·Windows 캐시를 데우고,
  # PR 에는 이 추가 비용을 부과하지 않는다.
  rdp-core-release-cache:
    name: rdp-core release cache (${{ matrix.os }})
    timeout-minutes: 30
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/rdp-core/Cargo.toml', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-rdp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Warm macOS RDP release targets
        if: matrix.os == 'macos-latest'
        run: node apps/desktop/scripts/build-rdp-core.cjs darwin universal

      - name: Warm Windows RDP release target
        if: matrix.os == 'windows-latest'
        run: node apps/desktop/scripts/build-rdp-core.cjs win32 x64

  vnc-core-release-cache:
    name: vnc-core release cache (${{ matrix.os }})
    timeout-minutes: 30
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/vnc-core

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/vnc-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-${{ hashFiles('services/vnc-core/Cargo.lock', 'services/vnc-core/Cargo.toml', 'services/vnc-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-v2-
            ${{ runner.os }}-${{ runner.arch }}-cargo-vnc-

      - name: Warm macOS VNC release targets
        if: matrix.os == 'macos-latest'
        run: node apps/desktop/scripts/build-vnc-core.cjs darwin universal

      - name: Warm Windows VNC release target
        if: matrix.os == 'windows-latest'
        run: node apps/desktop/scripts/build-vnc-core.cjs win32 x64

  desktop-test:
    name: desktop test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Install dependencies
        run: npm ci

      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary is installed
        # Electron 42+ 는 --version 검증에서도 Chromium 샌드박스를 초기화하는데,
        # CI 러너의 chrome-sandbox 는 setuid root 가 아니라 FATAL 로 죽는다. CI 한정 비활성화.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run ensure:electron --workspace @dolssh/desktop

      - name: Run desktop tests
        run: npm run test:desktop

  mobile-test:
    name: mobile test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check remote desktop FFI header copies
        run: npm run ffi:headers:check --workspace @dolssh/react-native-remote-desktop

      # 생성 스펙의 파생물이 어긋나지 않았는지 본다. gz 사본과 모듈 지도는 커밋된 JSON 만으로
      # 결정적으로 다시 만들어지므로 Fig 클론(네트워크)이 필요 없다 — 누가 스펙을 다시 만들고
      # 셋 중 하나를 커밋에서 빠뜨리면 여기서 걸린다.
      - name: Check the generated command specs are in sync
        run: |
          node apps/desktop/scripts/generate-command-specs.cjs --mirror-only
          git diff --exit-code -- \
            services/ssh-core/internal/commandspec/specs \
            apps/mobile/src/generated/command-spec-modules.ts

      - name: Run mobile typecheck
        run: npm run typecheck:mobile

      - name: Run mobile tests
        run: npm run test:mobile -- --runInBand

      # 번들을 실제로 만들어 본다. 타입체크·jest 는 Metro 의 모듈 해석을 지나지 않으므로,
      # 해석이 깨져도(예: AWS SDK 가 CJS 로 잡혀 node:stream 을 요구) CI 는 초록이고 릴리즈
      # 빌드에서만 터진다 — 실제로 그렇게 통과한 커밋이 있었다. 에뮬레이터 없이 1~2분이다.
      #
      # --dev false 로 돈다: 릴리즈가 만드는 것과 같은 번들이어야 릴리즈를 대신 지킬 수 있다.
      - name: Bundle mobile JS (android)
        run: >-
          npx react-native bundle --platform android --dev false
          --entry-file index.js --bundle-output "$RUNNER_TEMP/android.bundle"
        working-directory: apps/mobile

      - name: Bundle mobile JS (ios)
        run: >-
          npx react-native bundle --platform ios --dev false
          --entry-file index.js --bundle-output "$RUNNER_TEMP/ios.bundle"
        working-directory: apps/mobile

  # Go 엔진과 원격 데스크톱(Rust + JNI + Kotlin)을 **한 잡에서** 본다. 환경(Go·gomobile·Java·
  # SDK·NDK·node_modules)이 그대로 재사용되므로, 잡을 새로 만드는 것보다 훨씬 싸다.
  mobile-native-check:
    name: mobile native check (Go engine + remote desktop)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # SDK+NDK+node_modules+Gradle+cargo target 을 다 얹으면 ubuntu 러너의 여유(~14GB)로는
      # 빠듯하다. 릴리스 잡이 같은 이유로 이미 이 액션을 쓴다.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${MOBILE_ENGINE_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"

      # Installed from inside the module rather than with @latest, so the bind
      # runs against the x/mobile version services/ssh-core/go.mod pins — which
      # is what bindtools.go exists to keep. With @latest a breaking gomobile
      # release would change what CI builds with while the repo stood still.
      - name: Install gomobile
        working-directory: services/ssh-core
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Install dependencies
        run: npm ci

      # All four ABIs, not just the one the release ships: `int` is 32-bit on
      # armeabi-v7a and x86, and a width bug there compiles fine on arm64 and
      # would otherwise reach a release unnoticed.
      - name: Bind the Go SSH engine for every Android ABI
        run: npm run mobile:engine:build -- android "arm64-v8a,armeabi-v7a,x86_64,x86"

      # 여기서부터 원격 데스크톱(RDP/VNC) 네이티브다.
      #
      # **이 게이트가 없으면 Kotlin·JNI·안드로이드 타깃 Rust 가 깨져도 태그 빌드에서야 안다.**
      # 실제로 그랬다 — 뷰 매니저를 Fabric 이벤트 경로로 옮기다 낸 Kotlin 오류를 PR 단계에서
      # 잡을 방법이 없었다. 채널은 크레이트의 rust-toolchain.toml 이 정한다.
      - name: Set up Rust for the remote desktop cores
        shell: bash
        run: |
          (cd services/rdp-core && (rustup show active-toolchain || rustup toolchain install))
          (cd services/rdp-core && rustup target add aarch64-linux-android)

      # 키를 릴리스 잡(build-android)과 같은 모양으로 둔다 — 기본 브랜치에서 만든 이 캐시를
      # 태그 릴리스가 그대로 복원한다(호스트 타깃에서 이미 쓰는 방식과 같다).
      #
      # **target 전체가 아니라 안드로이드 트리플만 담는다.** 저장소 캐시 총량은 10GB 이고 이미
      # 3-OS 의 rdp/vnc 호스트 캐시가 그 안에 있다. 비싼 것(벤더 OpenSSL 빌드 산출물)은 트리플
      # 디렉터리 안에 있고, 호스트용 빌드 스크립트·proc-macro 는 다시 컴파일해도 1~2분이다.
      - name: Cache cargo build (Android cores)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target/aarch64-linux-android
            services/vnc-core/target/aarch64-linux-android
          key: ${{ runner.os }}-cargo-android-arm64-v8a-${{ hashFiles('services/rdp-core/Cargo.lock', 'services/vnc-core/Cargo.lock', 'services/rdp-core/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-arm64-v8a-
            ${{ runner.os }}-cargo-android-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 라이브러리 모듈 하나만 조립한다 — 그 안에 이 스택이 다 들어 있다: cargo 크로스컴파일
      # (buildRustLibs) → CMake JNI(libdvnc_jni.so) → Kotlin. 릴리스가 실제로 패키징하는
      # ABI 하나로만 돌려 시간을 아낀다.
      - name: Build the remote desktop Android module (Rust + JNI + Kotlin)
        working-directory: apps/mobile/android
        run: ./gradlew :dolssh_react-native-remote-desktop:assembleDebug -PreactNativeArchitectures=arm64-v8a

      # 최근 ARM64 기기는 16KB 페이지로 동작할 수 있고, 그런 기기에서는 LOAD 세그먼트가 4KB 로
      # 맞은 .so 를 커널이 매핑하지 못해 dlopen 이 실패한다 — 세션을 여는 순간 죽는다. NDK
      # 기본값이 4KB 라서 링커 플래그를 빼먹으면 조용히 되돌아가므로 산출물에서 확인한다.
      - name: Check native library page alignment
        run: npm run so:alignment:check --workspace @dolssh/react-native-remote-desktop
