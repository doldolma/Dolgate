name: Repository Test
run-name: Repository Test • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOBILE_ENGINE_NDK_VERSION: "27.1.12297006"

jobs:
  version-check:
    name: version check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run version check
        run: npm run version:check

  root-typecheck:
    name: root typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root typecheck
        run: npm run typecheck

  sync-api-test:
    name: sync-api test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dolgate
          POSTGRES_PASSWORD: dolgate
          POSTGRES_DB: dolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolgate -d dolgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dolgate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_API_POSTGRES_DSN: host=127.0.0.1 user=dolgate password=dolgate dbname=dolgate port=5432 sslmode=disable
      SYNC_API_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/dolgate?charset=utf8mb4&parseTime=True&loc=UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Run sync-api tests
        working-directory: services/sync-api
        run: go test ./... -cover

      - name: Stress vault lifecycle races
        working-directory: services/sync-api
        run: go test -race ./internal/store ./internal/http -run 'Vault|Sync' -count=3

  ssh-core-test:
    name: ssh-core test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Run ssh-core tests
        working-directory: services/ssh-core
        run: go test ./... -cover

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop dev ssh-core binaries
        run: npm run prepare:ssh-core:dev --workspace @dolssh/desktop

      - name: Verify macOS desktop helper binaries
        if: matrix.os == 'macos-latest'
        run: |
          test -f apps/desktop/release/resources/darwin/universal/bin/ssh-core
          test -f apps/desktop/release/resources/darwin/universal/bin/dolgate-dns-helper

      - name: Verify Windows desktop helper binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          test -f apps/desktop/release/resources/win32/x64/bin/ssh-core.exe
          test -f apps/desktop/release/resources/win32/x64/bin/dolgate-dns-helper.exe
          test -f apps/desktop/release/resources/win32/x64/bin/aws-conpty-wrapper.exe

      - name: Verify Linux desktop helper binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -f apps/desktop/release/resources/linux/x64/bin/ssh-core
          test -f apps/desktop/release/resources/linux/x64/bin/dolgate-dns-helper

  desktop-test:
    name: desktop test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary is installed
        # Electron 42+ 는 --version 검증에서도 Chromium 샌드박스를 초기화하는데,
        # CI 러너의 chrome-sandbox 는 setuid root 가 아니라 FATAL 로 죽는다. CI 한정 비활성화.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run ensure:electron --workspace @dolssh/desktop

      - name: Run desktop tests
        run: npm run test:desktop

  mobile-test:
    name: mobile test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile typecheck
        run: npm run typecheck:mobile

      - name: Run mobile tests
        run: npm run test:mobile -- --runInBand

  mobile-native-check:
    name: mobile native engine check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${MOBILE_ENGINE_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Install dependencies
        run: npm ci

      # All four ABIs, not just the one the release ships: `int` is 32-bit on
      # armeabi-v7a and x86, and a width bug there compiles fine on arm64 and
      # would otherwise reach a release unnoticed.
      - name: Bind the Go SSH engine for every Android ABI
        run: npm run mobile:engine:build -- android "arm64-v8a,armeabi-v7a,x86_64,x86"

      - name: Verify the engine compiles for iOS targets
        run: |
          cd services/ssh-core
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build $(go list ./... | grep -v '/cmd/')
