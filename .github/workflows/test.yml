name: Repository Test
run-name: Repository Test • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOBILE_ENGINE_NDK_VERSION: "27.1.12297006"

jobs:
  version-check:
    name: version check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run version check
        run: npm run version:check

  root-typecheck:
    name: root typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root typecheck
        run: npm run typecheck

  sync-api-test:
    name: sync-api test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dolgate
          POSTGRES_PASSWORD: dolgate
          POSTGRES_DB: dolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolgate -d dolgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dolgate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_API_POSTGRES_DSN: host=127.0.0.1 user=dolgate password=dolgate dbname=dolgate port=5432 sslmode=disable
      SYNC_API_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/dolgate?charset=utf8mb4&parseTime=True&loc=UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/sync-api/go.sum

      - name: Run sync-api tests
        working-directory: services/sync-api
        run: go test ./... -cover

      - name: Stress vault lifecycle races
        working-directory: services/sync-api
        run: go test -race ./internal/store ./internal/http -run 'Vault|Sync' -count=3

  ssh-core-test:
    name: ssh-core test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Run ssh-core tests
        working-directory: services/ssh-core
        run: go test ./... -cover

      # 세션 stdin·프롬프트 게이트·핸드셰이크는 타이머/스트림 goroutine이 공유하는 상태라
      # -race 없이는 레이스가 그대로 통과한다(실제로 통과했었다). 전체 ./...에 -race를 걸면
      # 3-OS 매트릭스 비용이 늘고 타이밍 민감한 패키지(ssmforward 등)가 러너 부하에 따라
      # 흔들릴 수 있어, 동시성 핵심 패키지만 좁게 검사한다. 레이스 검출은 OS에 거의
      # 무관하므로 ubuntu에서만 돌린다. 필요해지면 대상 패키지를 넓히면 된다.
      - name: Stress ssh-core session races
        if: matrix.os == 'ubuntu-latest'
        working-directory: services/ssh-core
        run: go test -race ./internal/sshsession ./internal/autocomplete -count=2

      # Only here: GOOS=ios needs cgo, and cgo for an Apple target needs the
      # Apple toolchain, so this cannot run on the Linux job that binds the
      # Android ABIs. Riding the macOS matrix leg keeps it off a runner of its
      # own.
      - name: Verify the engine compiles for iOS
        if: matrix.os == 'macos-latest'
        working-directory: services/ssh-core
        run: GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build $(go list ./... | grep -v '/cmd/')

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop dev ssh-core binaries
        run: npm run prepare:ssh-core:dev --workspace @dolssh/desktop

      - name: Verify macOS desktop helper binaries
        if: matrix.os == 'macos-latest'
        run: |
          test -f apps/desktop/release/resources/darwin/universal/bin/ssh-core
          test -f apps/desktop/release/resources/darwin/universal/bin/dolgate-dns-helper

      - name: Verify Windows desktop helper binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          test -f apps/desktop/release/resources/win32/x64/bin/ssh-core.exe
          test -f apps/desktop/release/resources/win32/x64/bin/dolgate-dns-helper.exe
          test -f apps/desktop/release/resources/win32/x64/bin/aws-conpty-wrapper.exe

      - name: Verify Linux desktop helper binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -f apps/desktop/release/resources/linux/x64/bin/ssh-core
          test -f apps/desktop/release/resources/linux/x64/bin/dolgate-dns-helper

  go-hygiene:
    name: go hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      # 포맷은 3-OS 매트릭스에 걸 필요가 없어 단독 잡으로 한 번만 본다.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l services/ssh-core services/sync-api)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt 미준수 파일:"
            echo "${unformatted}"
            echo "고치는 방법: gofmt -w <파일>"
            exit 1
          fi

      # ssh-core 는 ./... 에 선행 발견이 있어(vendor 한 ssmdatachannel 의 unreachable code,
      # sshconn 의 IPv6 주소 포맷은 수정됨) 게이트로 쓸 수 없다. gomobile bind 표면인
      # ./mobile/ 만 본다 — 여기가 깨지면 모바일 앱이 통째로 못 뜨므로 가장 값이 크다.
      - name: Vet the ssh-core mobile bind surface
        working-directory: services/ssh-core
        run: go vet ./mobile/

      - name: Vet sync-api
        working-directory: services/sync-api
        run: go vet ./...

      # ssh-core 에 의존성을 추가하면 sync-api 도 tidy 해야 한다(local replace 로 import 하므로).
      # 안 하면 sync-api 가 missing go.sum entry 로 깨지는데, 그 사실을 여기서 잡는다.
      - name: Check go.mod tidiness
        run: |
          for module in services/ssh-core services/sync-api; do
            if ! (cd "${module}" && go mod tidy -diff); then
              echo "${module} 의 go.mod/go.sum 이 tidy 상태가 아니다."
              echo "고치는 방법: cd ${module} && go mod tidy"
              exit 1
            fi
          done

  rdp-core-test:
    name: rdp-core test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        # 버전은 services/rdp-core/rust-toolchain.toml 이 정한다. profile = "minimal" 이라
        # rustfmt·clippy 는 없다 — 포맷 게이트를 넣으려면 컴포넌트부터 붙여야 한다.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: services/rdp-core

      # 첫 실행은 IronRDP·aws-lc-sys·openh264 를 소스에서 빌드해 오래 걸린다. 키가
      # Cargo.lock 이라 의존성이 그대로면 다음 실행부터 증분이고, restore-keys 로 낡은
      # 캐시도 물려받는다.
      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rdp-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('services/rdp-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # 3-OS 매트릭스로 돌리지 않는다. 컴파일 오류와 로직 회귀는 플랫폼에 거의 무관하고,
      # 플랫폼별 빌드는 릴리스 워크플로가 각 러너에서 이미 한다(크로스컴파일이 안 되는
      # 이유는 그쪽 주석 참조). 이 잡의 목적은 "PR 단계에서 Rust 가 아무 검증도 받지 않는"
      # 상태를 없애는 것이다 — 그 전까지는 릴리스 태그를 밀 때 처음 알았다.
      - name: Run rdp-core tests
        working-directory: services/rdp-core
        run: cargo test

      # 패치를 얹은 vendor 크레이트는 별도 패키지라 위 명령에 안 잡힌다. 상류가 자기 테스트
      # 하네스를 껐던 것도 켜 두었으므로(vendor/ironrdp-rdpdr-native/Cargo.toml) 여기서 돌린다 —
      # 공유 폴더 경로 봉쇄와 장치별 루트 해석이 이 안에 있다.
      - name: Run patched vendor crate tests
        working-directory: services/rdp-core
        run: cargo test -p ironrdp-rdpdr-native

  desktop-test:
    name: desktop test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Install dependencies
        run: npm ci

      # Electron 바이너리(플랫폼당 100MB대)는 @electron/get 이 npm 캐시와 다른 디렉터리로
      # 내려받으므로 setup-node 의 cache: npm 으로는 덮이지 않는다. 경로가 OS 별로 다르고
      # actions/cache 는 없는 경로를 조용히 넘기므로 세 개를 함께 적는다.
      #
      # 키는 lockfile 해시로 잡고 restore-keys 로 이전 캐시를 물려받는다 — @electron/get 이
      # 캐시를 버전·플랫폼별로 다시 키잉하므로, 낡은 항목이 섞여 있어도 버전이 그대로면
      # 재사용되고 바뀐 것만 새로 내려받는다.
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary is installed
        # Electron 42+ 는 --version 검증에서도 Chromium 샌드박스를 초기화하는데,
        # CI 러너의 chrome-sandbox 는 setuid root 가 아니라 FATAL 로 죽는다. CI 한정 비활성화.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run ensure:electron --workspace @dolssh/desktop

      - name: Run desktop tests
        run: npm run test:desktop

  mobile-test:
    name: mobile test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile typecheck
        run: npm run typecheck:mobile

      - name: Run mobile tests
        run: npm run test:mobile -- --runInBand

  mobile-native-check:
    name: mobile native engine check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: services/ssh-core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${MOBILE_ENGINE_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${MOBILE_ENGINE_NDK_VERSION}" >> "${GITHUB_ENV}"

      # Installed from inside the module rather than with @latest, so the bind
      # runs against the x/mobile version services/ssh-core/go.mod pins — which
      # is what bindtools.go exists to keep. With @latest a breaking gomobile
      # release would change what CI builds with while the repo stood still.
      - name: Install gomobile
        working-directory: services/ssh-core
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Install dependencies
        run: npm ci

      # All four ABIs, not just the one the release ships: `int` is 32-bit on
      # armeabi-v7a and x86, and a width bug there compiles fine on arm64 and
      # would otherwise reach a release unnoticed.
      - name: Bind the Go SSH engine for every Android ABI
        run: npm run mobile:engine:build -- android "arm64-v8a,armeabi-v7a,x86_64,x86"
