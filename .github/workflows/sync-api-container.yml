name: Sync API Container Publish
# 태그가 아니면 릴리스용 이미지가 아니다. 실행 목록에서 그 둘이 섞이면 어느 것이 자체 호스팅
# 서버로 나갈 이미지인지 알 수 없다.
run-name: ${{ github.event_name == 'release' && 'Sync API promote to latest' || startsWith(github.ref, 'refs/tags/') && 'Sync API Container Publish' || 'Sync API dev image' }} • ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  # 릴리스가 pre-release 에서 정식으로 바뀌면(gh release edit vX.Y.Z --prerelease=false --latest)
  # 그 버전 이미지에 `latest`·`major.minor` 를 붙인다(promote). 앱 업데이트·랜딩 페이지 다운로드와
  # 같은 순간에 자체 호스팅 서버의 `docker compose pull` 도 새 버전을 받는다.
  #
  # 정식 전환은 사람의 계정으로 해야 이 이벤트가 온다 — 워크플로가 GITHUB_TOKEN 으로 바꾸면 다른
  # 워크플로를 깨우지 않는다.
  release:
    types: [released]
  # 태그 없이 이미지를 올린다. 데스크톱보다 서버를 먼저 올려야 할 때 쓴다 — 태그를 밀면 데스크톱·
  # 모바일 릴리스까지 함께 나가므로 그것만으로는 분리할 수 없다.
  #
  # 이 이미지에는 **`latest` 를 붙이지 않는다**(아래 metadata 참고). 자체 호스팅 문서가 `:latest`
  # 를 권하므로, 붙이면 다음 `docker compose pull` 에 검증 안 된 이미지가 내려간다.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-version:
    # release 이벤트의 github.ref 도 refs/tags/… 다. 막지 않으면 정식 전환 때 이미지를 다시 빌드한다.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify repository version matches tag
        id: version
        shell: bash
        env:
          # 수동 실행에는 태그가 없다. 버전 정합성 검사는 그대로 하고 태그와의 대조만 건너뛴다
          # (release.yml 과 같은 규칙이다).
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm run version:check
          node - <<'NODE'
          const rootVersion = require('./package.json').version;
          const isTag = process.env.IS_TAG === 'true';
          if (isTag) {
            const tagName = process.env.GITHUB_REF_NAME;
            const expectedTag = `v${rootVersion}`;
            if (tagName !== expectedTag) {
              console.error(`Repository version mismatch: expected ${expectedTag}, got ${tagName}`);
              process.exit(1);
            }
            console.log(`Repository version ${rootVersion} matches ${tagName}`);
          } else {
            console.log(`Manual image build of repository version ${rootVersion} (no tag to match).`);
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${rootVersion}\n`);
          NODE

  test:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ssh-core/go.mod
          cache-dependency-path: |
            services/sync-api/go.sum
            services/ssh-core/go.sum

      - name: Run sync-api tests
        working-directory: services/sync-api
        run: go test ./... -cover

      - name: Run ssh-core AWS tests
        working-directory: services/ssh-core
        run: go test ./internal/awssession/... ./cmd/ssh-core/...

  publish:
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/doldolma/dolgate-sync-api
          # 태그 실행은 **정확한 버전 태그만** 올린다. 릴리스는 pre-release(베타)로 나가므로, 움직이는
          # 태그(`latest`·`major.minor`)는 정식 전환 때 promote 가 옮긴다. 자체 호스팅 문서가
          # `:latest` 를 권해서, 여기서 붙이면 베타 서버가 다음 `docker compose pull` 에 내려간다.
          # (semver 태그는 태그가 아닌 실행에서는 저절로 아무것도 만들지 않는다.)
          #
          # 수동 빌드는 커밋 sha 로만 올린다. 받는 쪽이 그 태그를 명시해야 쓰이므로 아무도 모르게
          # 내려가지 않는다.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/sync-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.verify-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 정식 전환된 버전의 이미지에 `latest`·`major.minor` 를 붙인다. 다시 빌드하지 않는다 — 태그 때
  # 올린 그 이미지(멀티 아키텍처 목록 그대로)에 이름만 더 단다. 예전 버전을 다시 Latest 로 지정하면
  # `latest` 도 그 버전으로 돌아간다.
  promote:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest and major.minor at the released version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "정식 버전 태그가 아니다: ${TAG_NAME}" >&2
            exit 1
          fi
          image=ghcr.io/doldolma/dolgate-sync-api
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${version%.*}" \
            "${image}:${version}"
